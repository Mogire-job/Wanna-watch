services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${WANNA_WATCH_DB_NAME:-wannawatch}
      POSTGRES_USER: ${WANNA_WATCH_DB_USER:-wannawatch}
      POSTGRES_PASSWORD: ${WANNA_WATCH_DB_PASSWORD:-wannawatch}
    ports:
      - "${WANNA_WATCH_DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      WANNA_WATCH_DB_URL: jdbc:postgresql://db:5432/${WANNA_WATCH_DB_NAME:-wannawatch}
      WANNA_WATCH_DB_USER: ${WANNA_WATCH_DB_USER:-wannawatch}
      WANNA_WATCH_DB_PASSWORD: ${WANNA_WATCH_DB_PASSWORD:-wannawatch}
      WANNA_WATCH_SERVER_PORT: 8081
      WANNA_WATCH_DEFAULT_COUNTRY: ${WANNA_WATCH_DEFAULT_COUNTRY:-US}
      WANNA_WATCH_CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      WANNA_WATCH_TMDB_API_READ_ACCESS_TOKEN: ${WANNA_WATCH_TMDB_API_READ_ACCESS_TOKEN:-}
      WANNA_WATCH_TMDB_SYNC_PAGES: ${WANNA_WATCH_TMDB_SYNC_PAGES:-1}
      WANNA_WATCH_SYNC_TOKEN: ${WANNA_WATCH_SYNC_TOKEN:-}
      WANNA_WATCH_SMTP_HOST: ${WANNA_WATCH_SMTP_HOST:-localhost}
      WANNA_WATCH_SMTP_PORT: ${WANNA_WATCH_SMTP_PORT:-1025}
      WANNA_WATCH_SMTP_USERNAME: ${WANNA_WATCH_SMTP_USERNAME:-}
      WANNA_WATCH_SMTP_PASSWORD: ${WANNA_WATCH_SMTP_PASSWORD:-}
      WANNA_WATCH_SMTP_AUTH: ${WANNA_WATCH_SMTP_AUTH:-false}
      WANNA_WATCH_SMTP_STARTTLS: ${WANNA_WATCH_SMTP_STARTTLS:-false}
      WANNA_WATCH_MAIL_FROM: ${WANNA_WATCH_MAIL_FROM:-no-reply@wannawatch.local}
      WANNA_WATCH_GOOGLE_CLIENT_ID: ${WANNA_WATCH_GOOGLE_CLIENT_ID:-disabled}
      WANNA_WATCH_GOOGLE_CLIENT_SECRET: ${WANNA_WATCH_GOOGLE_CLIENT_SECRET:-disabled}
      WANNA_WATCH_GOOGLE_SIGN_IN_ENABLED: ${WANNA_WATCH_GOOGLE_SIGN_IN_ENABLED:-false}
      WANNA_WATCH_FRONTEND_URL: ${WANNA_WATCH_FRONTEND_URL:-http://localhost:5174}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./frontend
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
