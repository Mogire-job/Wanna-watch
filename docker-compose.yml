services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wannawatch
      POSTGRES_USER: wannawatch
      POSTGRES_PASSWORD: wannawatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wannawatch"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
